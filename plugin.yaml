name: advisor
version: 0.1.1
description: >
  Advisor strategy for Hermes: run your chat on a cheap/low-effort model and
  consult a stronger model (e.g. Opus at high effort) only when a turn needs it.
  The main model can call the `advisor` tool; an optional Jev (TypeSafe) gate
  auto-escalates hard or high-stakes turns. Never switches the main model, so
  prompt caching is untouched.
author: superlowburn
license: MIT
homepage: https://github.com/superlowburn/hermes-advisor
tags: [advisor, routing, cost, opus, jev]
provides_tools:
  - advisor
provides_hooks:
  - pre_llm_call
requires_env:
  - name: TYPESAFE_API_KEY
    description: Optional. Enables Jev auto-escalation (mode auto/nudge). Without it only the advisor tool and /advisor work.
    url: https://console.typesafe.ai/keys
    secret: true
    optional: true
